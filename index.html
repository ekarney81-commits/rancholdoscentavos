<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Console</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
    margin-top: 0;
    font-size: 1.3rem;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
    color: #38bdf8;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

input,
textarea {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .95rem;
}

textarea {
    resize: vertical;
    min-height: 110px;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.section-title {
    margin: 28px 0 15px;
    font-size: .95rem;
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.variant {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    background: rgba(15, 23, 42, .55);
}

.variant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.variant-number {
    font-weight: 700;
    color: var(--text);
}

.variant-badge {
    font-size: .72rem;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    margin-top: 8px;
}

button:hover {
    background: var(--accent-hover);
}

button:disabled {
    background: var(--border);
    cursor: not-allowed;
}

.stats-box {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
    font-size: .95rem;
}

.results-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    padding: 10px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card);
    font-size: .84rem;
}

.result-item:last-child {
    border-bottom: none;
}

.result-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tag-sent {
    color: var(--success);
    font-weight: bold;
    white-space: nowrap;
}

.tag-failed {
    color: var(--danger);
    font-weight: bold;
    white-space: nowrap;
}

.variant-result {
    color: var(--muted);
    white-space: nowrap;
}

.sender-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 14px;
    margin-bottom:8px;
    border:1px solid var(--border,#ddd);
    border-radius:10px;
}

.sender-identity {
    min-width:0;
}

.sender-name {
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sender-status {
    font-size:12px;
    margin-top:4px;
    font-weight:600;
}

.sender-active {
    color:#16803c;
}

.sender-dead {
    color:#d93025;
}

.sender-delete {
    width:auto !important;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:18px;
    padding:6px 8px !important;
}

</style>
</head>

<body>

<div class="container">

    <h2>Mail Console</h2>

    <div class="form-group">
        <label>Send From</label>

        <div id="senderPool"></div>

        <button
            type="button"
            id="addSenderBtn"
            style="width:auto;padding:10px 16px;margin-top:10px;"
            onclick="openSenderModal()"
        >
            ＋ ADD SENDER
        </button>
    </div>

    <div
        id="senderModal"
        style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            align-items:center;
            justify-content:center;
            z-index:9999;
            padding:20px;
        "
    >
        <div
            style="
                width:min(520px,100%);
                background:var(--card,#fff);
                border-radius:14px;
                padding:24px;
                box-sizing:border-box;
            "
        >
            <h3 style="margin-top:0;">
                Add Sender
            </h3>

            <label>Sender Name</label>
            <input
                id="senderNameInput"
                type="text"
                placeholder="Ashley Owen"
            >

            <label>Sender Email</label>
            <input
                id="senderEmailInput"
                type="email"
                placeholder="ashleyowen@example.com"
            >

            <label>Reply-To Email</label>
            <input
                id="senderReplyToInput"
                type="email"
                autocomplete="email"
                placeholder="replies@example.com"
            >

            <label>Provider</label>
            <select
                id="senderProviderInput"
                onchange="updateCredentialFields()"
            >
                <option value="cloudflare">
                    Cloudflare
                </option>
                <option value="resend">
                    Resend
                </option>
            </select>

            <label id="senderCredentialLabel">
                Cloudflare API Token
            </label>

            <input
                id="senderCredentialInput"
                type="password"
                autocomplete="new-password"
                placeholder="Enter credential"
            >

            <div id="senderAccountGroup">
                <label>
                    Cloudflare Account ID
                </label>

                <input
                    id="senderAccountInput"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter Account ID"
                >
            </div>

            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:10px;
                    margin-top:20px;
                "
            >
                <button
                    type="button"
                    onclick="closeSenderModal()"
                >
                    CANCEL
                </button>

                <button
                    type="button"
                    id="saveSenderBtn"
                    onclick="saveSender()"
                >
                    SAVE SENDER
                </button>
            </div>
        </div>
    </div>

    <div class="form-group">
</div>

    <div class="section-title">Email Variants</div>

    <div id="variants"></div>

    <div style="display:flex;justify-content:flex-end;margin:14px 0 10px;">
        <button
            type="button"
            id="addVariantBtn"
            style="width:auto;padding:10px 16px;"
            onclick="addVariant()"
        >
            ＋ ADD SUBJECT & EMAIL
        </button>
    </div>

    <div class="section-title">Recipients</div>

    <div class="form-group">
        <label>Send To — One Recipient Per Line</label>
        <textarea
            id="sendTo"
            placeholder="customer1@gmail.com
customer2@gmail.com
customer3@gmail.com"></textarea>
    </div>

    <button id="sendBtn" type="button" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="stats-box" id="statsSection" style="display:none;">

        <div class="stats-row" id="sendingProgress">
            <strong>Status:</strong>
            <span>Ready</span>
        </div>

        <div class="stats-row">
            <span>
                Sent:
                <strong id="sentCount" style="color:var(--success)">0</strong>
            </span>

            <span>
                Not Sent:
                <strong id="notSentCount" style="color:var(--danger)">0</strong>
            </span>
        </div>

        <div class="results-list" id="resultsList"></div>

    </div>

</div>

<script>
const variantContainer = document.getElementById("variants");

const defaultVariants = [
    {


    const variants = getVariants();

    if (senders.length === 0) {
        alert("Please add at least one active sender.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient.");
        return;
    }

    if (variants.length === 0) {
        alert("Please complete at least one email variant.");
        return;
    }

    for (const variant of variants) {
        if (!variant.subject || !variant.body.trim()) {
            alert(
                "Every used variant must have both a subject and email body."
            );
            return;
        }
    }

    ensureQueueControls();

    const stats = document.getElementById("statsSection");
    const resultsList = document.getElementById("resultsList");

    stats.style.display = "block";
    resultsList.innerHTML = "";

    mailQueue = {
        senders,
        senderIndex: 0,
        variants,
        recipients,
        index: 0,
        sent: 0,
        failed: 0,
        results: []
    };

    queueRunning = false;
    queuePaused = false;
    queueStopped = false;

    document.getElementById("sentCount").textContent = "0";
    document.getElementById("notSentCount").textContent = "0";

    sendBtn.disabled = true;
    sendBtn.textContent = "QUEUE RUNNING...";

    updateQueueControls();
    updateQueueStatus(
        `Ready — ${recipients.length} unique recipients queued`
    );

    await processQueue();

    if (!mailQueue || mailQueue.index >= mailQueue.recipients.length || queueStopped) {
        sendBtn.disabled = false;
        sendBtn.textContent = "SEND EMAILS";
    }
}

ensureQueueControls();

</script>

</body>
</html>
