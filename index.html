<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Console</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
    margin-top: 0;
    font-size: 1.3rem;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
    color: #38bdf8;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
}

input,
textarea {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: .95rem;
}

textarea {
    resize: vertical;
    min-height: 110px;
    font-family: inherit;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent);
}

.section-title {
    margin: 28px 0 15px;
    font-size: .95rem;
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.variant {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
    background: rgba(15, 23, 42, .55);
}

.variant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.variant-number {
    font-weight: 700;
    color: var(--text);
}

.variant-badge {
    font-size: .72rem;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    margin-top: 8px;
}

button:hover {
    background: var(--accent-hover);
}

button:disabled {
    background: var(--border);
    cursor: not-allowed;
}

.stats-box {
    margin-top: 25px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}

.stats-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
    font-size: .95rem;
}

.results-list {
    margin-top: 15px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    padding: 10px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card);
    font-size: .84rem;
}

.result-item:last-child {
    border-bottom: none;
}

.result-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tag-sent {
    color: var(--success);
    font-weight: bold;
    white-space: nowrap;
}

.tag-failed {
    color: var(--danger);
    font-weight: bold;
    white-space: nowrap;
}

.variant-result {
    color: var(--muted);
    white-space: nowrap;
}

.sender-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 14px;
    margin-bottom:8px;
    border:1px solid var(--border,#ddd);
    border-radius:10px;
}

.sender-identity {
    min-width:0;
}

.sender-name {
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sender-status {
    font-size:12px;
    margin-top:4px;
    font-weight:600;
}

.sender-active {
    color:#16803c;
}

.sender-dead {
    color:#d93025;
}

.sender-delete {
    width:auto !important;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:18px;
    padding:6px 8px !important;
}


#accessGate {
    position:fixed;
    inset:0;
    z-index:20000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    padding:20px;
}
#accessGate .gate-card {
    width:min(420px,100%);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}
#accessGate h2 {
    margin-top:0;
}
#accessError {
    color:var(--danger);
    margin-top:10px;
    font-size:.85rem;
}
.proxy-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
    margin-bottom:15px;
}
.proxy-summary {
    display:flex;
    align-items:center;
    gap:12px;
    font-size:.85rem;
    color:var(--muted);
}
.proxy-summary button {
    width:auto;
    padding:6px 8px;
    margin:0;
    background:transparent;
    color:var(--muted);
}
.proxy-dead-count {
    color:var(--danger);
    font-weight:700;
}
.proxy-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px;
    margin-bottom:8px;
    border:1px solid var(--border);
    border-radius:10px;
}
.proxy-meta {
    min-width:0;
}
.proxy-address {
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
}
.proxy-detail {
    color:var(--muted);
    font-size:.78rem;
    margin-top:4px;
}
.proxy-actions {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}
.proxy-actions button {
    width:auto;
    padding:7px 9px;
    margin:0;
    font-size:.78rem;
}
.proxy-live {
    color:var(--success);
    font-weight:700;
}
.proxy-dead {
    color:var(--danger);
    font-weight:700;
}
.proxy-modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    z-index:15000;
    padding:20px;
}
.proxy-modal-card {
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
}
.proxy-modal-card input {
    margin-bottom:12px;
}
.proxy-test-status {
    font-size:.82rem;
    margin-top:8px;
}

</style>
</head>

<div id="accessGate" style="display:flex;">
    <div class="gate-card">
        <h2>Access restricted</h2>
        <p>Enter your access code to continue.</p>
        <input id="accessCodeInput" type="password" autocomplete="off"
               placeholder="Access code">
        <button type="button" id="unlockBtn" onclick="unlockApp()">UNLOCK</button>
        <div id="accessError"></div>
    </div>
</div>


<div class="container">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><h2 style="flex:1;">Mail Console</h2><button type="button" onclick="lockApp()" style="width:auto;padding:8px 12px;">LOCK</button></div>

    <div class="proxy-header">
        <div class="section-title" style="margin:0;">Proxy Routing</div>
        <div class="proxy-summary">
            <button type="button" onclick="openProxyList('active')" id="liveProxyCount">
                0 Proxies
            </button>
            <button type="button" onclick="openProxyList('dead')" id="deadProxyCount"
                    class="proxy-dead-count" style="display:none;">
                0 dead
            </button>
            <button type="button" onclick="openProxyModal()" title="Add proxy">＋</button>
        </div>
    </div>
    <div id="proxyList"></div>


    <div class="form-group">
        <label>Send From</label>

        <div id="senderPool"></div>

        <button
            type="button"
            id="addSenderBtn"

            ＋ ADD SENDER
        </button>
    </div>

    <div
        id="senderModal"
        style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            align-items:center;
            justify-content:center;
            z-index:9999;
            padding:20px;
        "
    >
        <div
            style="
                width:min(520px,100%);
                background:var(--card,#fff);
                border-radius:14px;
                padding:24px;
                box-sizing:border-box;
            "
        >
            <h3 style="margin-top:0;">
                Add Sender
            </h3>

            <label>Sender Name</label>
            <input
                id="senderNameInput"
                type="text"
                placeholder="Ashley Owen"
            >

            <label>Sender Email</label>
            <input
                id="senderEmailInput"
                type="email"
                placeholder="ashleyowen@example.com"
            >

            <label>Reply-To Email</label>
            <input
                id="senderReplyToInput"
                type="email"
                autocomplete="email"
                placeholder="replies@example.com"
            >

            <label>Provider</label>
            <select
                id="senderProviderInput"
                onchange="updateCredentialFields()"
            >
                <option value="cloudflare">
                    Cloudflare
                </option>
                <option value="resend">
                    Resend
                </option>
            </select>

            <label id="senderCredentialLabel">
                Cloudflare API Token
            </label>

            <input
                id="senderCredentialInput"
                type="password"
                autocomplete="new-password"
                placeholder="Enter credential"
            >

            <div id="senderAccountGroup">
                <label>
                    Cloudflare Account ID
                </label>

                <input
                    id="senderAccountInput"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter Account ID"
                >
            </div>

            <div
                style="
                    display:flex;
                    justify-content:flex-end;
                    gap:10px;
                    margin-top:20px;
                "
            >
                <button
                    type="button"
                    onclick="closeSenderModal()"
                >
                    CANCEL
                </button>

                <button
                    type="button"
                    id="saveSenderBtn"
                    onclick="saveSender()"
                >
                    SAVE SENDER
                </button>
            </div>
        </div>
    </div>

    <div class="form-group">
</div>

    <div class="section-title">Email Variants</div>

    <div id="variants"></div>

    <div style="display:flex;justify-content:flex-end;margin:14px 0 10px;">
        <button
            type="button"
            id="addVariantBtn"
            style="width:auto;padding:10px 16px;"
            onclick="addVariant()"
        >
            ＋ ADD SUBJECT & EMAIL
        </button>
    </div>

    <div class="section-title">Recipients</div>

    <div class="form-group">
        <label>Send To — One Recipient Per Line</label>
        <textarea
            id="sendTo"
            placeholder="customer1@gmail.com
customer2@gmail.com
customer3@gmail.com"></textarea>
    </div>

    <button id="sendBtn" type="button" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="stats-box" id="statsSection" style="display:none;">

        <div class="stats-row" id="sendingProgress">
            <strong>Status:</strong>
            <span>Ready</span>
        </div>

        <div class="stats-row">
            <span>
                Sent:
                <strong id="sentCount" style="color:var(--success)">0</strong>
            </span>

            <span>
                Not Sent:
                <strong id="notSentCount" style="color:var(--danger)">0</strong>
            </span>
        </div>

        <div class="results-list" id="resultsList"></div>

    </div>


<div id="proxyModal" class="proxy-modal">
    <div class="proxy-modal-card">
        <h3 id="proxyModalTitle">Add Proxy</h3>

        <label>Proxy Host / IP</label>
        <input id="proxyHostInput" type="text" placeholder="proxy.example.com">

        <label>Port</label>
        <input id="proxyPortInput" type="number" min="1" max="65535" placeholder="8080">

        <label>Username</label>
        <input id="proxyUsernameInput" type="text" autocomplete="off">

        <label>Password</label>
        <input id="proxyPasswordInput" type="password" autocomplete="new-password">

        <button type="button" id="testProxyBtn" onclick="testProxyConnection()">
            TEST CONNECTION
        </button>
        <div id="proxyTestStatus" class="proxy-test-status"></div>

        <div style="display:flex;gap:10px;margin-top:18px;">
            <button type="button" onclick="closeProxyModal()">CANCEL</button>
            <button type="button" id="saveProxyBtn" onclick="saveProxy()">SAVE PROXY</button>
        </div>
    </div>
</div>

</div>

function addVariant() {
    const container = document.getElementById("variants");

    const card = document.createElement("div");
    card.className = "variant-card";

    card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>New Variant</strong>
            <button
                type="button"
                onclick="this.closest('.variant-card').remove(); renumberVariants();"
                style="width:auto;padding:6px 10px;"
            >
                DELETE
            </button>
        </div>

        <input
            type="text"
            class="variant-subject"
            placeholder="Email subject"
        >

        <label>Email</label>
        <textarea
            class="variant-body"
            placeholder="Email body"
        ></textarea>
    `;

    container.appendChild(card);
    renumberVariants();
}

function renumberVariants() {
    document.querySelectorAll("#variants .variant-card").forEach((card, index) => {
        const title = card.querySelector("strong");
        if (title) {
            title.textContent = `Variant ${index + 1}`;

}

function renderResults(results) {
    const list = document.getElementById("resultsList");

    list.innerHTML = "";

    results.forEach(result => {
        const item = document.createElement("div");

        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent =
            result.variant && result.proxy_number
                ? `V${result.variant}/Proxy${result.proxy_number}`
                : result.variant
                    ? `V${result.variant}`
                    : "—";

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";

        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        list.appendChild(item);
    });
}


let mailQueue = null;
let queueRunning = false;
let queuePaused = false;
let queueStopped = false;
let queueCountdownTimer = null;

function ensureQueueControls() {
    if (document.getElementById("queueControls")) return;

    const sendBtn = document.getElementById("sendBtn");

    const controls = document.createElement("div");
    controls.id = "queueControls";
    controls.style.cssText = `
        display:flex;
        gap:10px;
        margin-top:12px;
        flex-wrap:wrap;
    `;

    controls.innerHTML = `
        <button type="button" id="playQueueBtn">▶ PLAY</button>
        <button type="button" id="pauseQueueBtn">⏸ PAUSE</button>
        <button type="button" id="stopQueueBtn">■ STOP</button>
    `;

    sendBtn.parentNode.insertBefore(controls, sendBtn.nextSibling);

    document.getElementById("playQueueBtn").addEventListener("click", async () => {
        if (!mailQueue) {
            startSending();
            return;
        }

        if (queueRunning || !queuePaused || queueStopped) return;

        queuePaused = false;
        queueStopped = false;
        updateQueueControls();
        await processQueue();
    });

    document.getElementById("pauseQueueBtn").addEventListener("click", () => {
        if (!mailQueue || !queueRunning) return;

        queuePaused = true;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus("Paused — press PLAY to continue");
        updateQueueControls();
    });

    document.getElementById("stopQueueBtn").addEventListener("click", () => {
        if (!mailQueue) return;

        queueStopped = true;
        queuePaused = false;
        queueRunning = false;
        clearInterval(queueCountdownTimer);

        updateQueueStatus(
            `Stopped — ${mailQueue.index} / ${mailQueue.recipients.length} processed`
        );

        updateQueueControls();
    });

    updateQueueControls();
}

function updateQueueControls() {
    const play = document.getElementById("playQueueBtn");
    const pause = document.getElementById("pauseQueueBtn");
    const stop = document.getElementById("stopQueueBtn");

    if (!play || !pause || !stop) return;

    if (!mailQueue) {
        play.disabled = false;
        pause.disabled = true;
        stop.disabled = true;
        return;
    }

    play.disabled = queueRunning || queueStopped;
    pause.disabled = !queueRunning;
    stop.disabled = queueStopped || mailQueue.index >= mailQueue.recipients.length;
}

function updateQueueStatus(message) {
    const progress = document.getElementById("sendingProgress");

    if (!mailQueue) return;

    const total = mailQueue.recipients.length;
    const processed = mailQueue.index;
    const remaining = Math.max(total - processed, 0);

    progress.innerHTML = `
        <strong>Status:</strong>
        <span>
            SENT ${mailQueue.sent} / ${total}
            &nbsp;•&nbsp;
            FAILED ${mailQueue.failed}
            &nbsp;•&nbsp;
            REMAINING ${remaining}
        </span>
        <br>
        <span>${message}</span>
    `;
}

function addQueueResult(result) {
    mailQueue.results.push(result);

    const resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = "";

    mailQueue.results.forEach(result => {
        const item = document.createElement("div");
        item.className = "result-item";

        const email = document.createElement("span");
        email.className = "result-email";
        email.textContent = result.email;

        const variant = document.createElement("span");
        variant.className = "variant-result";
        variant.textContent =
            result.variant === "—"
                ? "—"
                : (result.proxy_number ? `V${result.variant}/Proxy${result.proxy_number}` : `V${result.variant}`);

        const status = document.createElement("span");
        status.className =
            result.status === "Sent"
                ? "tag-sent"
                : "tag-failed";
        status.textContent = result.status;

        item.appendChild(email);
        item.appendChild(variant);
        item.appendChild(status);

        if (result.status !== "Sent" && result.error) {
            const error = document.createElement("span");
            error.className = "result-error";
            error.textContent =
                typeof result.error === "string"
                    ? result.error
                    : JSON.stringify(result.error);
            item.appendChild(error);
        }

        resultsList.appendChild(item);
    });
}

async function waitTenSeconds() {
    for (let seconds = 10; seconds > 0; seconds--) {
        if (!mailQueue || queueStopped) return false;

        while (queuePaused && !queueStopped) {
            updateQueueStatus("Paused — press PLAY to continue");
            await new Promise(resolve => setTimeout(resolve, 250));
        }

        if (queueStopped) return false;

        updateQueueStatus(`Next email in ${seconds} seconds...`);

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    return !queueStopped;
}

async function processQueue() {
    if (!mailQueue || queueRunning || queueStopped) return;

    queueRunning = true;
    queuePaused = false;
    updateQueueControls();

    const {
        variants,
        recipients
    } = mailQueue;

    try {
        while (
            mailQueue.index < recipients.length &&
            !queueStopped
        ) {
            while (queuePaused && !queueStopped) {
                queueRunning = false;
                updateQueueStatus("Paused — press PLAY to continue");
                updateQueueControls();

                await new Promise(resolve => setTimeout(resolve, 250));

                if (!queuePaused && !queueStopped) {
                    queueRunning = true;
                    updateQueueControls();
                }
            }

            if (queueStopped) break;

            const recipient = recipients[mailQueue.index];

            updateQueueStatus(
                `Sending ${mailQueue.index + 1} / ${recipients.length} — ${recipient}`
            );

            try {
                const response = await fetch("/api/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        sender: getNextSender(),
                        to: [recipient],
                        variants
                    })
                });

                const data = await response.json();

                if (data.sender_failed && data.sender_id) {
                    markSenderDead(data.sender_id);

                    const deadSender = senderPool.find(
                        sender => sender.id === data.sender_id
                    );

                    updateQueueStatus(
                        `Sender ${deadSender?.email || "unknown"} marked DEAD — continuing`
                    );

                    mailQueue.failed++;

                    addQueueResult({
                        email: recipient,
                        status: "Failed",
                        variant:
                            data.results &&
                            data.results.length &&
                            data.results[0].variant
                                ? data.results[0].variant
                                : "—",
                        error:
                            data.error ||
                            (
                                data.results &&
                                data.results.length
                                    ? data.results[0].error
                                    : "Sender failed"
                            ),
                        sender: data.sender,
                        provider: data.provider,
                        sender_failed: true
                    });

                    mailQueue.index++;
                    continue;
                }

                const result =
                    data.results && data.results.length
                        ? data.results[0]
                        : null;

                if (!response.ok || !result) {
                    throw new Error(
                        typeof data.error === "string"
                            ? data.error
                            : JSON.stringify(data.error || data)
                    );
                }

                addQueueResult(result);

                if (result.status === "Sent") {
                    mailQueue.sent++;
                } else {
                    mailQueue.failed++;
                }

            } catch (error) {
                mailQueue.failed++;

                addQueueResult({
                    email: recipient,
                    status: "Failed",
                    variant: "—",
                    error: error.message || String(error)
                });
            }

            mailQueue.index++;

            document.getElementById("sentCount").textContent =
                mailQueue.sent;

            document.getElementById("notSentCount").textContent =
                mailQueue.failed;

            updateQueueStatus(
                `Completed ${mailQueue.index} / ${recipients.length}`
            );

            if (
                mailQueue.index < recipients.length &&
                !queueStopped
            ) {
                const completed = await waitTenSeconds();

                if (!completed) break;
            }
        }

        if (queueStopped) {
            updateQueueStatus(
                `Stopped — ${mailQueue.index} / ${recipients.length} processed`
            );
            return;
        }

        if (mailQueue.index >= recipients.length) {
            updateQueueStatus(
                `Completed — ${recipients.length} processed`
            );

            document.getElementById("sendTo").value = "";

            queueRunning = false;
            queuePaused = false;

            updateQueueControls();
        }

    } finally {
        queueRunning = false;
        updateQueueControls();
    }
}



let senderPool = [];

// Sender records are persisted server-side in Supabase.
// Browser storage is intentionally not used, so every browser/profile/device
// sees the same sender pool.
async function loadSenders() {
    try {
        const response = await fetch("/api/senders", {
            method: "GET",
            headers: { "Accept": "application/json" },
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to load senders.");
        }

        senderPool = Array.isArray(data.senders) ? data.senders : [];
        renderSenders();
    } catch (error) {
        senderPool = [];
        renderSenders();
        console.error("Unable to load sender pool:", error);
        alert(error.message || "Unable to load saved senders.");
    }
}

// Kept as a compatibility no-op for existing sender actions.
// Persistence is handled by the server API, not browser storage.
function saveSenders() {}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderSenders() {
    const container = document.getElementById("senderPool");
    if (!container) return;

    container.innerHTML = "";

    senderPool.forEach((sender, index) => {
        const row = document.createElement("div");

        row.className = "sender-row";

        row.innerHTML = `
            <div class="sender-identity">
                <div class="sender-name">
                    ${escapeHtml(
                        sender.name
                        ? `${sender.name} <${sender.email}>`
                        : sender.email
                    )}
                </div>

                <div class="sender-status ${
                    sender.status === "dead"
                        ? "sender-dead"
                        : "sender-active"
                }">
                    ${
                        sender.status === "dead"
                            ? "● DEAD"
                            : "● ACTIVE"
                    }
                </div>
            </div>

            <button
                type="button"
                class="sender-delete"
                title="Delete sender"
                aria-label="Delete sender"
                onclick="deleteSender(${index})"
            >
                🗑
            </button>
        `;

        container.appendChild(row);
    });

    saveSenders();
}

function openSenderModal() {
    const modal = document.getElementById("senderModal");
    if (!modal) return;

    document.getElementById("senderNameInput").value = "";
    document.getElementById("senderEmailInput").value = "";
    document.getElementById("senderReplyToInput").value = "";
    document.getElementById("senderCredentialInput").value = "";
    document.getElementById("senderAccountInput").value = "";

    updateCredentialFields();

    modal.style.display = "flex";
}

function closeSenderModal() {
    const modal = document.getElementById("senderModal");
    if (modal) {
        modal.style.display = "none";
    }
}

function updateCredentialFields() {
    const provider =
        document.getElementById("senderProviderInput").value;

    const credentialLabel =
        document.getElementById("senderCredentialLabel");

    const accountGroup =
        document.getElementById("senderAccountGroup");

    if (provider === "cloudflare") {
        credentialLabel.textContent =
            "Cloudflare API Token";

        accountGroup.style.display = "block";
    } else {
        credentialLabel.textContent =
            "Resend API Key";

        accountGroup.style.display = "none";
    }
}

async function saveSender() {
    const name =
        document.getElementById("senderNameInput")
            .value
            .trim();

    const email =
        document.getElementById("senderEmailInput")
            .value
            .trim();

    const replyTo =
        document.getElementById("senderReplyToInput")
            .value
            .trim() || email;

    const provider =
        document.getElementById("senderProviderInput")
            .value;

    const credential =
        document.getElementById("senderCredentialInput")
            .value
            .trim();

    const accountId =
        document.getElementById("senderAccountInput")
            .value
            .trim();

    if (!email) {
        alert("Sender email is required.");
        return;
    }

    if (!credential) {
        alert("Credential is required.");
        return;
    }

    if (
        provider === "cloudflare" &&
        !accountId
    ) {
        alert("Cloudflare Account ID is required.");
        return;
    }

    const saveButton =
        document.getElementById("saveSenderBtn");

    saveButton.disabled = true;
    saveButton.textContent = "SAVING...";

    try {
        const response = await fetch("/api/senders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: crypto.randomUUID(),
                name,
                email,
                reply_to: replyTo,
                provider,
                credential,
                account_id: accountId
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Unable to save sender."
            );
        }

        senderPool.push({
            id: data.sender.id,
            name: data.sender.name,
            email: data.sender.email,
            reply_to: data.sender.reply_to || data.sender.email,
            provider: data.sender.provider,
            status: "active"
        });

        saveSenders();
        renderSenders();
        closeSenderModal();

    } catch (error) {
        alert(
            error.message ||
            "Unable to save sender."
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "SAVE SENDER";
    }
}

async function deleteSender(index) {
    const sender = senderPool[index];

    if (!sender) return;

    if (
        !confirm(
            `Delete ${sender.email}?`
        )
    ) {
        return;
    }

    try {
        const response = await fetch(
            `/api/senders/${encodeURIComponent(sender.id)}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                "Unable to delete sender."
            );
        }

        senderPool.splice(index, 1);

        saveSenders();
        renderSenders();

    } catch (error) {
        alert(
            error.message ||
            "Unable to delete sender."
        );
    }
}

function getSenders() {
    return senderPool.filter(sender =>
        sender.status !== "dead" &&
        sender.email &&
        sender.email.includes("@")
    );
}

function getNextSender() {
    const active = getSenders();

    if (!active.length) {
        throw new Error(
            "No active senders available."
        );
    }

    const index =
        mailQueue.senderIndex %
        active.length;

    const sender = active[index];

    mailQueue.senderIndex++;

    return {
        id: sender.id,
        name: sender.name,
        email: sender.email,
        provider: sender.provider
    };
}

function markSenderDead(senderId) {
    const sender = senderPool.find(
        item => item.id === senderId
    );

    if (!sender) return;

    sender.status = "dead";

    saveSenders();
    renderSenders();
}


let proxyPool = [];
let proxyModalMode = "add";
let editingProxyId = null;
let proxyTestPassed = false;


async function lockApp() {
    try {
        await fetch("/api/auth/lock", {method: "POST"});
    } finally {
        location.reload();
    }
}

async function unlockApp() {
    const input = document.getElementById("accessCodeInput");
    const error = document.getElementById("accessError");
    const button = document.getElementById("unlockBtn");

    error.textContent = "";
    button.disabled = true;

    try {
        const response = await fetch("/api/auth/unlock", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({code: input.value})
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Invalid access code.");
        }

        document.getElementById("accessGate").style.display = "none";
        await loadSenders();
        await loadProxies();
    } catch (error) {
        error.textContent = error.message || "Unable to unlock.";
    } finally {
        button.disabled = false;
    }
}

document.getElementById("accessCodeInput").addEventListener("keydown", event => {
    if (event.key === "Enter") unlockApp();
});

async function loadProxies() {
    try {
        const response = await fetch("/api/proxies", {cache: "no-store"});
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to load proxies.");
        }

        proxyPool = Array.isArray(data.proxies) ? data.proxies : [];
        renderProxySummary();
    } catch (error) {
        console.error("Unable to load proxies:", error);
    }
}

function renderProxySummary() {
    const live = proxyPool.filter(proxy => proxy.status === "active").length;
    const dead = proxyPool.filter(proxy => proxy.status !== "active").length;

    const liveButton = document.getElementById("liveProxyCount");
    const deadButton = document.getElementById("deadProxyCount");

    liveButton.textContent = `${live} ${live === 1 ? "Proxy" : "Proxies"}`;

    if (dead) {
        deadButton.style.display = "inline-block";
        deadButton.textContent = `${dead} dead`;
    } else {
        deadButton.style.display = "none";
    }
}

function openProxyList(status) {
    const list = document.getElementById("proxyList");
    const filtered = proxyPool.filter(proxy =>
        status === "active"
            ? proxy.status === "active"
            : proxy.status !== "active"
    );

    list.innerHTML = "";

    if (!filtered.length) {
        list.innerHTML = `<div style="color:var(--muted);padding:8px 0;">
            No ${status === "active" ? "live" : "dead"} proxies.
        </div>`;
        return;
    }

    filtered.forEach(proxy => {
        const row = document.createElement("div");
        row.className = "proxy-row";

        const error = proxy.last_error
            ? escapeHtml(proxy.last_error)
            : "";

        row.innerHTML = `
            <div class="proxy-meta">
                <div class="proxy-address">
                    Proxy${proxy.proxy_number}: ${escapeHtml(proxy.host)}:${proxy.port}
                </div>
                <div class="proxy-detail">
                    ${escapeHtml(proxy.username || "No username")}
                    &nbsp;•&nbsp;
                    <span class="${proxy.status === "active" ? "proxy-live" : "proxy-dead"}">
                        ${proxy.status === "active" ? "LIVE" : "DEAD"}
                    </span>
                </div>
                ${error ? `<div class="proxy-detail">${error}</div>` : ""}
            </div>
            <div class="proxy-actions">
                ${proxy.status !== "active"
                    ? `<button type="button" onclick="testSavedProxy('${proxy.id}')">TEST AGAIN</button>`
                    : ""}
                <button type="button" onclick="editProxy('${proxy.id}')">EDIT</button>
                <button type="button" onclick="deleteProxy('${proxy.id}')">DELETE</button>
            </div>
        `;

        list.appendChild(row);
    });
}

function openProxyModal(proxy = null) {
    proxyModalMode = proxy ? "edit" : "add";
    editingProxyId = proxy ? proxy.id : null;
    proxyTestPassed = false;

    document.getElementById("proxyModalTitle").textContent =
        proxy ? "Edit Proxy" : "Add Proxy";

    document.getElementById("proxyHostInput").value = proxy?.host || "";
    document.getElementById("proxyPortInput").value = proxy?.port || "";
    document.getElementById("proxyUsernameInput").value = proxy?.username || "";
    document.getElementById("proxyPasswordInput").value = "";
    document.getElementById("proxyTestStatus").textContent =
        proxy ? "Enter a new password only if you want to change it." : "";

    document.getElementById("proxyModal").style.display = "flex";
}

function closeProxyModal() {
    document.getElementById("proxyModal").style.display = "none";
}

function editProxy(proxyId) {
    const proxy = proxyPool.find(item => item.id === proxyId);
    if (proxy) openProxyModal(proxy);
}

async function testProxyConnection() {
    const host = document.getElementById("proxyHostInput").value.trim();
    const port = document.getElementById("proxyPortInput").value.trim();
    const username = document.getElementById("proxyUsernameInput").value.trim();
    const password = document.getElementById("proxyPasswordInput").value;

    if (!host || !port || !password) {
        alert("Host, port and password are required for a connection test.");
        return;
    }

    const button = document.getElementById("testProxyBtn");
    const status = document.getElementById("proxyTestStatus");

    button.disabled = true;
    button.textContent = "TESTING...";
    status.textContent = "";

    try {
        const response = await fetch("/api/proxies/test-connection", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({host, port, username, password})
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            proxyTestPassed = false;
            throw new Error(data.error || "Proxy test failed.");
        }

        proxyTestPassed = true;
        status.textContent = "Connection successful. Proxy can be saved.";
        status.style.color = "var(--success)";
    } catch (error) {
        proxyTestPassed = false;
        status.textContent = error.message || "Proxy test failed.";
        status.style.color = "var(--danger)";
    } finally {
        button.disabled = false;
        button.textContent = "TEST CONNECTION";
    }
}

async function saveProxy() {
    const host = document.getElementById("proxyHostInput").value.trim();
    const port = document.getElementById("proxyPortInput").value.trim();
    const username = document.getElementById("proxyUsernameInput").value.trim();
    const password = document.getElementById("proxyPasswordInput").value;

    if (!host || !port) {
        alert("Host and port are required.");
        return;
    }

    if (proxyModalMode === "add" && !password) {
        alert("Password is required.");
        return;
    }

    if (!proxyTestPassed) {
        alert("Test the proxy connection successfully before saving.");
        return;
    }

    const button = document.getElementById("saveProxyBtn");
    button.disabled = true;
    button.textContent = "SAVING...";

    try {
        const endpoint = proxyModalMode === "add"
            ? "/api/proxies"
            : `/api/proxies/${encodeURIComponent(editingProxyId)}`;

        const response = await fetch(endpoint, {
            method: proxyModalMode === "add" ? "POST" : "PATCH",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({host, port, username, password})
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to save proxy.");
        }

        closeProxyModal();
        await loadProxies();
        openProxyList("active");
    } catch (error) {
        alert(error.message || "Unable to save proxy.");
    } finally {
        button.disabled = false;
        button.textContent = "SAVE PROXY";
    }
}

async function testSavedProxy(proxyId) {
    try {
        const response = await fetch(
            `/api/proxies/${encodeURIComponent(proxyId)}/test`,
            {method: "POST"}
        );
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Proxy test failed.");
        }

        await loadProxies();
        openProxyList("active");
    } catch (error) {
        alert(error.message || "Proxy test failed.");
        await loadProxies();
        openProxyList("dead");
    }
}

async function deleteProxy(proxyId) {
    const proxy = proxyPool.find(item => item.id === proxyId);
    if (!proxy) return;

    if (!confirm(`Delete Proxy${proxy.proxy_number}?`)) return;

    try {
        const response = await fetch(
            `/api/proxies/${encodeURIComponent(proxyId)}`,
            {method: "DELETE"}
        );
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Unable to delete proxy.");
        }

        await loadProxies();
        document.getElementById("proxyList").innerHTML = "";
    } catch (error) {
        alert(error.message || "Unable to delete proxy.");
    }
}


loadSenders();

async function startSending() {
    if (mailQueue && !queueStopped) {
        if (queuePaused) {
            queuePaused = false;
            await processQueue();
        }
        return;
    }

    const sendBtn = document.getElementById("sendBtn");

    const senders = getSenders();
const rawTo = document
        .getElementById("sendTo")
        .value;

    const recipients = [
        ...new Set(
            rawTo
                .split(/\r?\n/)
                .map(email => email.trim())
                .filter(Boolean)
                .map(email => email.toLowerCase())
        )
    ];

    const variants = getVariants();

    if (senders.length === 0) {
        alert("Please add at least one active sender.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient.");
        return;
    }

    if (variants.length === 0) {
        alert("Please complete at least one email variant.");
        return;
    }

    for (const variant of variants) {
        if (!variant.subject || !variant.body.trim()) {
            alert(
                "Every used variant must have both a subject and email body."
            );
            return;
        }
    }

    ensureQueueControls();

    const stats = document.getElementById("statsSection");
    const resultsList = document.getElementById("resultsList");

    stats.style.display = "block";
    resultsList.innerHTML = "";

    mailQueue = {
        senders,
        senderIndex: 0,
        variants,
        recipients,
        index: 0,
        sent: 0,
        failed: 0,
        results: []
    };

    queueRunning = false;
    queuePaused = false;
    queueStopped = false;

    document.getElementById("sentCount").textContent = "0";
    document.getElementById("notSentCount").textContent = "0";

    sendBtn.disabled = true;
    sendBtn.textContent = "QUEUE RUNNING...";

    updateQueueControls();
    updateQueueStatus(
        `Ready — ${recipients.length} unique recipients queued`
    );

    await processQueue();

    if (!mailQueue || mailQueue.index >= mailQueue.recipients.length || queueStopped) {
        sendBtn.disabled = false;
        sendBtn.textContent = "SEND EMAILS";
    }
}

ensureQueueControls();
